# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(LOCK_DSN): 'flock'
    env(PASSWORD_RESET_TTL): '3600'
    env(PASSWORD_RESET_REQUEST_LIMIT): '3'
    env(PASSWORD_RESET_REQUEST_INTERVAL): '1 hour'
    env(PASSWORD_RESET_BASE_URL): 'http://localhost:8080'
    env(SENDGRID_PASSWORD_RESET_TEMPLATE_ES): 'd-94364cdab2c64321b691171c8d4bf420'
    env(SENDGRID_PASSWORD_RESET_TEMPLATE_EN): 'd-94364cdab2c64321b691171c8d4bf420'
    env(OAUTH_GOOGLE_CLIENT_ID): ''
    env(OAUTH_GOOGLE_CLIENT_SECRET): ''
    env(OAUTH_FACEBOOK_CLIENT_ID): ''
    env(OAUTH_FACEBOOK_CLIENT_SECRET): ''
    env(OAUTH_BASE_URL): 'http://localhost:8080'
    env(OAUTH_FACEBOOK_VERSION): 'v23.0'
    env(SENDGRID_VERIFICATION_TEMPLATE_ES): ''
    env(SENDGRID_VERIFICATION_TEMPLATE_EN): ''
    env(MAILER_DSN): 'null://null'
    env(MAILER_FROM): 'no-reply@nurschool.example'
    env(REGISTRATION_BASE_URL): 'http://localhost:8080'
    env(REGISTRATION_TTL): '604800'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Nurschool\:
        resource: '../src/'
        exclude:
            - '../src/OAuth/Provider/ProviderRequest.php'
            - '../src/Mail/SendGrid/Message/'
            - '../src/Mail/SendGrid/Transport/SendGridTransport.php'
            - '../src/Mail/SendGrid/Transport/Exception/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Nurschool\Mail\PasswordResetEmailSender:
        alias: Nurschool\Mail\SendGrid\SendGridPasswordResetEmailSender

    Nurschool\Mail\VerificationEmailSender:
        alias: Nurschool\Mail\SendGrid\SendGridVerificationEmailSender

    Nurschool\Mail\SendGrid\Template\SendGridTemplateProvider:
        arguments:
            $defaultLocale: '%kernel.default_locale%'
            $templates:
                password_reset:
                    es: '%env(SENDGRID_PASSWORD_RESET_TEMPLATE_ES)%'
                    en: '%env(SENDGRID_PASSWORD_RESET_TEMPLATE_EN)%'
                verification:
                    es: '%env(SENDGRID_VERIFICATION_TEMPLATE_ES)%'
                    en: '%env(SENDGRID_VERIFICATION_TEMPLATE_EN)%'

    sendgrid.http_client: '@http_client'

    Nurschool\Mail\SendGrid\Transport\SendGridTransportFactory:
        arguments:
            $client: '@sendgrid.http_client'
        tags: ['mailer.transport_factory']

    oauth.http_client: '@http_client'

    Nurschool\OAuth\ProviderClient:
        arguments:
            $client: '@oauth.http_client'
            $baseUrl: '%env(OAUTH_BASE_URL)%'

    Nurschool\OAuth\Provider\GoogleProvider:
        arguments:
            $clientId: '%env(OAUTH_GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(OAUTH_GOOGLE_CLIENT_SECRET)%'

    Nurschool\OAuth\Provider\FacebookProvider:
        arguments:
            $clientId: '%env(OAUTH_FACEBOOK_CLIENT_ID)%'
            $clientSecret: '%env(OAUTH_FACEBOOK_CLIENT_SECRET)%'
            $version: '%env(OAUTH_FACEBOOK_VERSION)%'

when@test:
    services:
        test.sendgrid_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
            arguments: [[]]
        sendgrid.http_client: '@test.sendgrid_http_client'

        test.oauth_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            public: true
            arguments: [[]]
        oauth.http_client: '@test.oauth_http_client'

framework:
    cache:
        pools:
            cache.password_reset_requests:
                adapter: cache.adapter.filesystem
            cache.password_reset_submissions:
                adapter: cache.adapter.filesystem
    lock:
        resources:
            password_reset_requests: flock
            password_reset_submissions: flock
    rate_limiter:
        password_reset_submissions:
            policy: sliding_window
            limit: '%env(int:PASSWORD_RESET_SUBMISSION_LIMIT)%'
            interval: '%env(PASSWORD_RESET_SUBMISSION_INTERVAL)%'
            cache_pool: cache.password_reset_submissions
            lock_factory: lock.password_reset_submissions.factory
        password_reset_requests:
            policy: fixed_window
            limit: '%env(int:PASSWORD_RESET_REQUEST_LIMIT)%'
            interval: '%env(PASSWORD_RESET_REQUEST_INTERVAL)%'
            cache_pool: cache.password_reset_requests
            lock_factory: lock.password_reset_requests.factory
